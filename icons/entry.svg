<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7f5ff"/><stop offset="1" stop-color="#e7e5fa"/></linearGradient>
