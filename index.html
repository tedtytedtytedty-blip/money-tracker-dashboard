<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031a1c">
<meta name="description" content="Money Tracker Dashboard launcher">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<title>Money Tracker Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#031719;--text:#f8fbfc;--muted:#b8c3c7;--green:#08e69a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#031719}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100svh;overflow-x:hidden;background:radial-gradient(ellipse at 80% -6%,rgba(0,235,177,.35),transparent 34%),radial-gradient(ellipse at -8% 48%,rgba(0,174,200,.23),transparent 29%),radial-gradient(ellipse at 107% 72%,rgba(0,235,108,.16),transparent 31%),linear-gradient(155deg,#02151b 0%,#021719 48%,#030b1c 100%);display:flex;justify-content:center;position:relative;isolation:isolate}
body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid rgba(0,238,194,.45);filter:drop-shadow(0 0 12px rgba(0,227,194,.12));z-index:-1}
body:before{width:66vw;height:66vw;max-width:680px;max-height:680px;border-radius:48% 52% 65% 35%;top:-48vw;left:-30vw;transform:rotate(-28deg);background:linear-gradient(140deg,rgba(0,160,185,.2),rgba(0,35,46,.02))}
body:after{width:80vw;height:80vw;max-width:720px;max-height:720px;border-radius:55% 45% 30% 70%;right:-58vw;bottom:-44vw;transform:rotate(26deg);background:linear-gradient(140deg,rgba(0,255,122,.12),rgba(0,43,57,.02))}
main{width:100%;max-width:560px;min-height:100svh;padding:clamp(14px,2.6vh,30px) 14px max(34px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vh,28px)}
.brand{width:100%;display:flex;align-items:center;flex-direction:column;text-align:center;gap:clamp(5px,1vh,10px);transform:translateY(-4px)}
.brand-mark{width:clamp(146px,39vw,203px);height:clamp(146px,39vw,203px);display:block;filter:drop-shadow(0 12px 28px rgba(0,255,172,.17))}
h1{margin:0;font-weight:760;letter-spacing:-.055em;line-height:1.02;font-size:clamp(30px,8.4vw,42px);text-shadow:0 2px 16px rgba(255,255,255,.08)}
.subtitle{margin:1px 0 0;color:#c4cdd1;font-weight:300;letter-spacing:.015em;font-size:clamp(25px,6.3vw,32px);line-height:1.05}
.grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{aspect-ratio:.90;min-width:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-radius:clamp(24px,7vw,34px);border:1px solid var(--edge);background:linear-gradient(148deg,var(--tile-a) 0%,var(--tile-b) 52%,rgba(1,15,22,.98) 100%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 1px 0 0 rgba(255,255,255,.12),inset -1px -2px 0 rgba(0,0,0,.28),inset 0 -20px 32px rgba(0,0,0,.24),0 2px 0 rgba(255,255,255,.08),0 5px 0 rgba(0,0,0,.24),0 13px 23px rgba(0,0,0,.3),0 19px 32px rgba(0,0,0,.17),0 0 23px var(--glow);transition:transform 150ms cubic-bezier(.2,.8,.2,1),box-shadow 150ms ease,filter 150ms ease;text-decoration:none;isolation:isolate;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;outline:none}
.tile:before{content:"";position:absolute;inset:1px;border-radius:inherit;background:radial-gradient(ellipse at 28% -4%,rgba(255,255,255,.24),transparent 44%),linear-gradient(145deg,rgba(255,255,255,.09) 0%,transparent 27%,transparent 67%,rgba(0,0,0,.25) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);z-index:0;opacity:.88;transition:opacity 120ms ease;pointer-events:none}
.tile:after{display:none}
.tile:active{transform:translateY(4px) scale(.978);filter:brightness(1.07);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.38),inset 0 -16px 25px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.04),0 3px 0 rgba(0,0,0,.2),0 7px 13px rgba(0,0,0,.27),0 0 17px var(--glow)}
.tile:active:before{opacity:1}
.tile:active svg{transform:translateY(3px) scale(.966);filter:drop-shadow(0 1px 1px rgba(0,0,0,.26))}
.tile:focus-visible{outline:2px solid rgba(255,255,255,.95);outline-offset:4px}
@media (hover:hover) and (pointer:fine){.tile:hover{transform:translateY(-2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.42),inset 0 -3px 0 rgba(0,0,0,.24),0 3px 0 rgba(255,255,255,.1),0 8px 0 rgba(0,0,0,.22),0 18px 28px rgba(0,0,0,.34),0 0 27px var(--glow)}.tile:hover:before{opacity:1}.tile:hover svg{transform:translateY(-3px) perspective(700px) rotateX(1deg)}}
.tile svg{width:98%;height:98%;max-width:225px;max-height:225px;overflow:visible;position:relative;z-index:1;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.26)) drop-shadow(0 2px 1px rgba(255,255,255,.09));transform:translateY(-2px) perspective(700px) rotateX(1deg);transform-origin:center center;transition:transform 150ms cubic-bezier(.2,.8,.2,1),filter 150ms ease}
.dashboard{--tile-a:rgba(0,108,220,.8);--tile-b:rgba(0,196,171,.48);--edge:rgba(61,224,255,.92);--glow:rgba(0,193,255,.17);--icon-top:rgba(41,195,255,.25);--icon-bottom:rgba(0,32,77,.65);--icon-edge:rgba(116,228,255,.68)}
.sheets{--tile-a:rgba(0,180,100,.68);--tile-b:rgba(0,110,84,.58);--edge:rgba(53,255,166,.8);--glow:rgba(0,237,128,.15);--icon-top:rgba(76,255,176,.22);--icon-bottom:rgba(0,46,37,.68);--icon-edge:rgba(111,255,185,.62)}
.line{--tile-a:rgba(0,216,78,.62);--tile-b:rgba(0,95,69,.7);--edge:rgba(69,255,144,.8);--glow:rgba(0,255,99,.16);--icon-top:rgba(91,255,119,.2);--icon-bottom:rgba(0,51,30,.72);--icon-edge:rgba(120,255,148,.62)}
.make{--tile-a:rgba(132,0,255,.68);--tile-b:rgba(36,16,116,.8);--edge:rgba(223,78,255,.88);--glow:rgba(148,0,255,.2);--icon-top:rgba(231,86,255,.25);--icon-bottom:rgba(25,0,73,.78);--icon-edge:rgba(235,136,255,.66)}
@media(min-width:560px){main{justify-content:center;padding-top:22px}.grid{gap:13px}.tile{aspect-ratio:.94}.tile svg{max-width:250px;max-height:250px}}
@media(max-height:760px){main{gap:clamp(10px,1.8vh,18px);padding-top:10px;padding-bottom:max(20px,env(safe-area-inset-bottom))}.brand-mark{width:clamp(116px,30vh,168px);height:clamp(116px,30vh,168px)}h1{font-size:clamp(28px,7vw,36px)}.subtitle{font-size:clamp(22px,5vw,28px)}.grid{gap:9px}.tile{border-radius:24px;aspect-ratio:.98}.tile svg{max-width:210px;max-height:210px}}
@media(prefers-reduced-motion:reduce){.tile,.tile svg,.tile:before{transition:none!important}.tile:active,.tile:hover,.tile:active svg,.tile:hover svg{transform:none}}
</style>
</head>
