.tile:before{content:"";position:absolute;inset:1px;border-radius:inherit;background:radial-gradient(ellipse at 28% -4%,rgba(255,255,255,.24),transparent 44%),linear-gradient(145deg,rgba(255,255,255,.09) 0%,transparent 27%,transparent 67%,rgba(0,0,0,.25) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);z-index:0;opacity:.88;transition:opacity 120ms ease;pointer-events:none}
.tile:after{display:none}

.tile:active:before{opacity:1}

.tile:focus-visible{outline:2px solid rgba(255,255,255,.95);outline-offset:4px}

<script>
(() => {
  const canvas = document.getElementById("matrixCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
  if (!ctx) return;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // A Matrix-style rain: distinct vertical streams, bright leading glyphs,
  // randomized katakana/digits, variable stream lengths and layered tails.
  const glyphs = "ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜ0123456789:・.=*+-<>¦";
  let width = 0, height = 0, streams = [], raf = 0, lastFrame = 0, running = false;
  const rand = (max) => Math.floor(Math.random() * max);
  const pick = () => glyphs[rand(glyphs.length)];
  const streamFontSize = () => (width < 420 ? 18 : 23) + rand(width < 420 ? 6 : 7);

  function resetStream(stream, initial = false) {
    stream.count = 12 + rand(23);
    stream.chars = Array.from({ length: stream.count }, () => pick());
    stream.fontSize = streamFontSize();
    stream.speed = 80 + Math.random() * 155;
    stream.opacity = 0.52 + Math.random() * 0.42;
    stream.changeEvery = 0.045 + Math.random() * 0.08;
    stream.charTimer = 0;
    if (initial) {
      stream.y = Math.random() * height;
    } else {
      stream.y = -rand(28) * stream.fontSize;
    }
  }

  function makeStream(x) {
    const stream = { x, y: 0, count: 0, chars: [], fontSize: 14,
      speed: 150, opacity: 0.8, changeEvery: 0.08, charTimer: 0 };
    resetStream(stream, true);
    return stream;
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.max(1, Math.floor(height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    streams = [];
    const spacing = width < 420 ? 18 : 27;
    for (let x = 2; x < width; x += spacing) {
      if (Math.random() < 0.025) continue;
      streams.push(makeStream(x));
    }

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "rgba(0, 12, 8, .98)";
    ctx.fillRect(0, 0, width, height);
    // Keep the rain animated on desktop too, even when reduced-motion is enabled.
  }

  function drawStatic() {
    ctx.textBaseline = "top";
    for (const stream of streams) {
      ctx.font = stream.fontSize + "px monospace";
      for (let i = 0; i < stream.count; i++) {
        const y = stream.y - i * stream.fontSize;
        if (y < 0 || y > height) continue;
        if (i === 0) {
          ctx.fillStyle = "rgba(235,255,240,.92)";
        } else {
          const alpha = Math.max(.06, stream.opacity * (1 - i / stream.count));
          ctx.fillStyle = "rgba(0,255,105," + alpha.toFixed(2) + ")";
        }
        ctx.fillText(stream.chars[i], stream.x, y);
      }
    }
  }

  function frame(now) {
    if (!running || document.hidden) { raf = 0; return; }
    const dt = lastFrame ? Math.min((now - lastFrame) / 1000, 0.05) : 1 / 60;
    lastFrame = now;

    // Longer trails reveal the movement direction while delta-time preserves smooth motion.
    const fadeAlpha = 1 - Math.pow(0.965, dt * 60);
    ctx.fillStyle = "rgba(0, 12, 8, " + fadeAlpha.toFixed(3) + ")";
    ctx.fillRect(0, 0, width, height);
    ctx.textBaseline = "top";

    for (const stream of streams) {
      stream.y += stream.speed * dt;
      stream.charTimer += dt;
      if (stream.charTimer >= stream.changeEvery) {
        stream.charTimer = 0;
        if (Math.random() < .86) stream.chars[0] = pick();
        const changes = 2 + rand(4);
        for (let n = 0; n < changes; n++) {
          if (Math.random() < .78) {
            stream.chars[rand(stream.count)] = pick();
          }
        }
      }

      ctx.font = stream.fontSize + "px monospace";
      for (let i = 0; i < stream.count; i++) {
        const y = stream.y - i * stream.fontSize;
        if (y < -stream.fontSize || y > height + stream.fontSize) continue;

        if (i === 0) {
          ctx.shadowBlur = 9;
          ctx.shadowColor = "rgba(75,255,150,.95)";
          ctx.fillStyle = "rgba(239,255,244,.98)";
        } else if (i < 4) {
          const alpha = stream.opacity * (1 - i * .12);
          ctx.shadowBlur = 4;
          ctx.shadowColor = "rgba(0,255,105,.55)";
          ctx.fillStyle = "rgba(40,255,120," + alpha.toFixed(2) + ")";
        } else {
          const tail = Math.max(.045, stream.opacity * Math.pow(1 - i / stream.count, 1.35));
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(0,210,82," + tail.toFixed(2) + ")";
        }
        ctx.fillText(stream.chars[i], stream.x, y);
      }

      if (stream.y - stream.count * stream.fontSize > height) {
        resetStream(stream);
      }
    }

    ctx.shadowBlur = 0;
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (document.hidden || running) return;
    running = true;
    lastFrame = 0;
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  resize();
  if (!reduceMotion) start();
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  window.addEventListener("resize", resize, { passive: true });
  window.addEventListener("pagehide", stop, { passive: true });
})();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
